name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SKIP_MIGRATIONS: "1"
          SESSION_SECRET: ci-secret-non-utilise-en-production
