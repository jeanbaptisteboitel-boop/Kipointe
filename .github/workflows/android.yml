name: Applications Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Construire les applications
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KIPOINTE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Versions de débogage
        if: env.KEYSTORE_BASE64 == ''
        run: gradle -p android --no-daemon assembleDebug
      - name: Versions signées
        if: env.KEYSTORE_BASE64 != ''
        env:
          KIPOINTE_KEYSTORE_PASSWORD: ${{ secrets.KIPOINTE_KEYSTORE_PASSWORD }}
          KIPOINTE_KEY_ALIAS: ${{ secrets.KIPOINTE_KEY_ALIAS }}
          KIPOINTE_KEY_PASSWORD: ${{ secrets.KIPOINTE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kipointe.jks"
          KIPOINTE_KEYSTORE="$RUNNER_TEMP/kipointe.jks" gradle -p android --no-daemon :app:assembleRelease :salarie:assembleRelease :salarie:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kipointe-tablette
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kipointe-salarie-android
          path: |
            android/salarie/build/outputs/apk/**/*.apk
            android/salarie/build/outputs/bundle/**/*.aab
          if-no-files-found: error
