# Projet Xcode de l'application iPhone du salarié, décrit pour XcodeGen :
#   brew install xcodegen && cd ios && xcodegen generate && open Kipointe.xcodeproj
name: Kipointe
options:
  bundleIdPrefix: com.omniup
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Nom d'hôte du service, sans https:// (modifiable ici ou en ligne de commande).
    KIPOINTE_HOTE: kipointe.vercel.app
targets:
  Kipointe:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Kipointe
        KipointeHote: $(KIPOINTE_HOTE)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: L'appareil photo sert à lire le QR code de la tablette de pointage et à photographier un justificatif.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omniup.kipointe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
